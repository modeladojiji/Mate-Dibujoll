<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a mi página</title>
    <!-- Importa el componente de Google para el renderizado 3D y AR -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        /* Fondo general con el tono lila pastel */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E8DFF5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Contenedor del encabezado (Título + Botón del conejo) */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding: 0 15px;
            z-index: 10;
        }

        /* Título superior de bienvenida corregido */
        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #4A148C;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Botón del conejo interactivo visualmente */
        .usagi-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .usagi-btn:active {
            transform: scale(0.9);
        }

        /* Miniatura circular del conejo */
        .usagi-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7B2CBF;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: block;
        }

        /* Contenedor del visor 3D en lila claro */
        model-viewer {
            width: 100%;
            flex: 1;
            background-color: #F3EAFE;
            --poster-color: transparent; 
        }

        /* Texto descriptivo de fondo que aparece al cargar */
        .loading-text-container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .loading-text {
            font-size: 16px;
            color: #5A189A;
            font-weight: 600;
            max-width: 85%;
            background-color: rgba(232, 223, 245, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            line-height: 1.4;
        }

        /* Contenedor flotante inferior para alinear el mate y el botón por si acaso */
        .ar-controls-container {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        /* Imagen del mate arriba del botón AR */
        .mate-image-overlay {
            width: 120px;
            height: auto;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
        }

        /* Ocultamos el botón original porque ahora el inicio será automático */
        #ar-button {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Encabezado con título corregido y botón miniatura del conejo -->
    <div class="header-container">
        <div class="header-title">Bienvenido a mi página. ٩(ˊᗜˋ )و</div>
        <button class="usagi-btn" type="button" aria-label="Conejo interactivo">
            <img src="chiikawa-usagi.jfif" alt="Conejo" class="usagi-thumb">
        </button>
    </div>

    <!-- El visor ahora tiene la propiedad 'ar-placement' y 'ar' para forzar la acción -->
    <model-viewer 
        id="mate-viewer"
        src="mateurbano.glb" 
        ios-src="mate_urbano aipon.usdz"
        ar
        ar-modes="scene-viewer quick-look webxr"
        camera-controls 
        shadow-intensity="1" 
        auto-rotate>
        
        <!-- Texto explicativo que se ve de fondo si tarda en abrir -->
        <div slot="poster" class="loading-text-container">
            <div class="loading-text">
                Abriendo Realidad Aumentada... ¡Preparate para ver el mate "BRAVO"! 
            </div>
        </div>

        <!-- Solo dejamos la imagen del mate flotando de forma decorativa abajo si no salta AR -->
        <div class="ar-controls-container">
            <img src="BRAVO-4001B-VIOLETA-1.jpg" alt="Mate Urbano" class="mate-image-overlay">
            <button slot="ar-button" id="ar-button"></button>
        </div>
        
    </model-viewer>

    <script>
        const viewer = document.getElementById('mate-viewer');
        
        // Función mágica: Apenas el visor web detecte que cargó en el celular, 
        // va a simular un clic automático oculto para saltar directo a la cámara.
        viewer.addEventListener('load', () => {
            setTimeout(() => {
                if (viewer.canActivateAR) {
                    viewer.activateAR();
                }
            }, 1000); // Espera 1 segundo de cortesía visual antes de saltar
        });
    </script>

</body>
</html>
