<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D interactivo con RA</title>
    
    <!-- Cargamos el componente de Google para renderizar 3D y Realidad Aumentada -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f7f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Contenedor del visualizador 3D ocupando toda la pantalla */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Botón personalizado para activar la Realidad Aumentada */
        #ar-button {
            background-color: #007bff;
            border-radius: 30px;
            border: none;
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
            transition: background-color 0.2s ease;
        }

        #ar-button:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- 
      Configuración del visualizador:
      - 'src': el archivo 3D principal (formato .glb) para Android y la web.
      - 'ios-src': el archivo convertido (formato .usdz) exclusivo para iPhones viejos o compatibilidad total.
      - 'ar': habilita el modo de realidad aumentada.
      - 'ar-modes': define qué tecnologías del teléfono intenta usar en orden de prioridad.
    -->
    <model-viewer 
        src="mateurbano.glb" 
        ios-src="mate_urbanoaipon.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1" 
        auto-rotate>
        
        <!-- Botón que solo aparecerá en celulares compatibles con RA -->
        <button slot="ar-button" id="ar-button">
            📱 Ver en tu espacio (RA)
        </button>
        
    </model-viewer>

</body>
</html>
