<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a mi página</title>
    
    <!-- Importación oficial de model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        /* Fondo general con el tono lila pastel */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E8DFF5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Contenedor del encabezado (Título + Botón del conejo) */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding: 0 15px;
            z-index: 10;
            position: relative;
        }

        /* Título superior de bienvenida */
        .header-title {
            font-size: 22px;
            font-weight: bold;
            color: #4A148C;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Botón del conejo */
        .usagi-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.1s ease;
            position: relative;
        }

        .usagi-btn:active {
            transform: scale(0.9);
        }

        /* Miniatura circular del conejo */
        .usagi-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7B2CBF;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: block;
        }

        /* Estilo para los brillitos dinámicos alrededor */
        .sparkle {
            position: absolute;
            font-size: 16px;
            pointer-events: none;
            animation: burstOut 0.8s ease-out forwards;
            z-index: 100;
        }

        @keyframes burstOut {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.4);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(1.3);
            }
        }

        /* Imagen del mate ubicada justo debajo del título */
        .mate-image-header {
            width: 90px;
            height: auto;
            margin: 12px 0 8px 0;
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.15));
            z-index: 10;
        }

        /* Contenedor del visor 3D en lila claro */
        model-viewer {
            width: 100%;
            flex: 1; /* Ocupa el espacio central restante */
            background-color: #F3EAFE;
            --poster-color: transparent; 
        }

        /* Texto descriptivo de fondo que aparece al cargar */
        .loading-text-container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .loading-text {
            font-size: 18px;
            color: #5A189A;
            font-weight: 600;
            max-width: 80%;
            background-color: rgba(232, 223, 245, 0.85);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            line-height: 1.4;
        }

        /* Contenedor flotante inferior para el botón AR */
        .ar-controls-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* Botón inferior para activar la Realidad Aumentada */
        #ar-button {
            background-color: #7B2CBF;
            border-radius: 30px;
            border: none;
            color: white;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(123, 44, 191, 0.4);
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            white-space: nowrap;
        }

        #ar-button:active {
            background-color: #5A189A;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Encabezado con título y botón del conejo -->
    <div class="header-container">
        <div class="header-title">Bienvenido a mi página. ٩(ˊᗜˋ )u </div>
        <button class="usagi-btn" id="usagiButton" type="button" aria-label="Conejo interactivo">
            <img src="chiikawa-usagi.jfif" alt="Conejo" class="usagi-thumb">
        </button>
    </div>

    <!-- Imagen del mate colocada debajo del título -->
    <img src="BRAVO-4001B-VIOLETA-1.jpg" alt="Mate Urbano" class="mate-image-header">

    <!-- Visor 3D con src y ios-src inicialmente vacíos -->
    <model-viewer 
        id="modelViewer"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        poster="cargando.png" 
        shadow-intensity="1" 
        auto-rotate>
        
        <!-- Texto explicativo de fondo -->
        <div slot="poster" class="loading-text-container">
            <div class="loading-text">
                Este es mi objeto de estudio, el mate "BRAVO" visto en AR. ¡Divertite!
            </div>
        </div>

        <!-- Botón flotante inferior de Realidad Aumentada -->
        <div class="ar-controls-container">
            <button slot="ar-button" id="ar-button">
                🎇 Ver en tu espacio (AR) 🎇
            </button>
        </div>
        
    </model-viewer>

    <script>
        // 1. Script para los brillitos alrededor del botón del conejo
        const usagiButton = document.getElementById('usagiButton');

        usagiButton.addEventListener('click', () => {
            const rect = usagiButton.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const numSparkles = 8;
            const symbols = ['✨', '⭐', '💫', '✨'];

            for (let i = 0; i < numSparkles; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const radius = 22 + Math.random() * 8; 

                const startX = centerX + Math.cos(angle) * radius;
                const startY = centerY + Math.sin(angle) * radius;

                sparkle.style.left = `${startX}px`;
                sparkle.style.top = `${startY}px`;

                const distanceOut = 30 + Math.random() * 25;
                const dx = Math.cos(angle) * distanceOut;
                const dy = Math.sin(angle) * distanceOut;
                
                sparkle.style.setProperty('--dx', `${dx}px`);
                sparkle.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 800);
            }
        });

        // 2. Script para que el modelo 3D CARGUE SOLAMENTE al tocar el botón de AR
        const arButton = document.getElementById('ar-button');
        const modelViewer = document.getElementById('modelViewer');

        arButton.addEventListener('click', () => {
            // Si el modelo aún no tiene asignada la ruta, se la cargamos en este momento
            if (!modelViewer.hasAttribute('src')) {
                modelViewer.setAttribute('src', 'mateurbano.glb');
                modelViewer.setAttribute('ios-src', 'mate_urbanoaipon.usdz');
            }
        });
    </script>

</body>
</html>
