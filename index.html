<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Modelo en Realidad Aumentada</title>
    
    <!-- 1. Importa el script oficial de Google (siempre usa la última versión) -->
    <script type="module" src="mateurbano.glb" 
        ios-src="mate_urbano aipon.usdz"
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate>"></script>

    <style>
        /* Define el tamaño del contenedor del modelo 3D */
        model-viewer {
            width: 100%;
            height: 500px;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <!-- 2. Configura la etiqueta con los atributos de Scene Viewer -->
    <model-viewer 
        src="https://modelviewer.dev" 
        ar 
        ar-modes="scene-viewer webxr quick-look" 
        camera-controls 
        touch-action="pan-y"
        alt="Un modelo 3D de un astronauta"
        shadow-intensity="1">
        
        <!-- Botón personalizado para activar la RA (opcional) -->
        <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
            👋 Ver en tu espacio
        </button>

    </model-viewer>

</body>
</html>
