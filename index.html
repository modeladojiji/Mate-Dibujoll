<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a mi página</title>
    <!-- Importa el componente de Google para el renderizado 3D y AR -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        /* Fondo general con el tono lila pastel */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E8DFF5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Contenedor del encabezado (Título + Botón del conejo) */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding: 0 15px;
            z-index: 10;
        }

        /* Título superior de bienvenida corregido */
        .header-title {
            font-size: 20px;
            font-weight: bold;
            color: #4A148C;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Botón del conejo (sin utilidad pero interactivo visualmente) */
        .usagi-btn {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-radius: 50%;
            transition: transform 0.1s ease;
        }

        .usagi-btn:active {
            transform: scale(0.9);
        }

        /* Miniatura circular del conejo */
        .usagi-thumb {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #7B2CBF;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: block;
        }

        /* Contenedor del visor 3D en lila claro */
        model-viewer {
            width: 100%;
            flex: 1;
            background-color: #F3EAFE;
            --poster-color: transparent; 
        }

        /* Texto descriptivo de fondo que aparece al cargar */
        .loading-text-container {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .loading-text {
            font-size: 16px;
            color: #5A189A;
            font-weight: 600;
            max-width: 85%;
            background-color: rgba(232, 223, 245, 0.9);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            line-height: 1.4;
        }

        /* Panel de control inferior (Contiene el Mate, Botón AR y Botón Alternativo) */
        .ar-controls-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
            width: 90%;
            max-width: 340px;
        }

        /* Imagen del mate */
        .mate-image-overlay {
            width: 90px;
            height: auto;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
            margin-bottom: 5px;
        }

        /* Estilo base para los botones */
        .btn-universal {
            width: 100%;
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(123, 44, 191, 0.3);
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        /* Botón AR Principal */
        #ar-button {
            background-color: #7B2CBF;
        }

        #ar-button:active {
            transform: scale(0.95);
            background-color: #5A189A;
        }

        /* Botón de Emergencia si el de arriba falla */
        .fallback-btn {
            background-color: #9D4EDD;
            font-size: 13px;
            padding: 8px 16px;
            box-shadow: 0 3px 8px rgba(157, 78, 221, 0.2);
        }

        .fallback-btn:active {
            transform: scale(0.95);
            background-color: #7B2CBF;
        }
    </style>
</head>
<body>

    <!-- Encabezado con título corregido y botón miniatura del conejo -->
    <div class="header-container">
        <div class="header-title">Bienvenido a mi página. ٩(ˊᗜˋ )و</div>
        <button class="usagi-btn" type="button" aria-label="Conejo interactivo">
            <img src="chiikawa-usagi.jfif" alt="Conejo" class="usagi-thumb">
        </button>
    </div>

    <!-- Visor 3D configurado con modos nativos ordenados -->
    <model-viewer 
        id="viewer"
        src="mateurbano.glb" 
        ios-src="mateurbanoaipon.usdz"
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate>
        
        <!-- Texto explicativo de fondo -->
        <div slot="poster" class="loading-text-container">
            <div class="loading-text">
                Este es mi objeto de estudio, el mate "BRAVO" visto en AR. ¡Divertite!
            </div>
        </div>

        <!-- Grupo inferior de controles universales -->
        <div class="ar-controls-container">
            <!-- Imagen fija del mate -->
            <img src="BRAVO-4001B-VIOLETA-1.jpg" alt="Mate Urbano" class="mate-image-overlay">
            
            <!-- Opción 1: Botón AR nativo (Intenta abrir directo) -->
            <button slot="ar-button" id="ar-button" class="btn-universal">
                ✨ Ver en tu espacio (AR)
            </button>
            
            <!-- Opción 2: Botón de respaldo (Fuerza la apertura externa si el de arriba no responde) -->
            <a id="android-fallback" class="btn-universal fallback-btn" href="#" target="_blank" style="display: none;">
                ¿No abre? Forzar AR en Android 🤖
            </a>
        </div>
        
    </model-viewer>

    <script>
        // Este script genera un enlace alternativo dinámico para Android.
        // Si el botón principal falla, este enlace obliga al sistema de Google a abrir la cámara.
        document.addEventListener("DOMContentLoaded", () => {
            const currentURL = window.location.href;
            // Quitamos el protocolo http/https para armar el comando intent de Android Scene Viewer
            const cleanURL = currentURL.replace(/^https?:\/\//, "");
            
            const fallbackBtn = document.getElementById("android-fallback");
            
            // Construimos la ruta directa al archivo alojado en tu servidor web
            const modelURL = currentURL.substring(0, currentURL.lastIndexOf('/')) + "/mateurbano.glb";
            
            // Comando nativo de Android intent para Scene Viewer
            fallbackBtn.href = `intent://://google.com{encodeURIComponent(modelURL)}&mode=ar_only#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(currentURL)};end;`;

            // Detectamos si el usuario está en Android para mostrar el botón de auxilio
            if (/Android/i.test(navigator.userAgent)) {
                fallbackBtn.style.display = "block";
            }
        });
    </script>

</body>
</html>
